name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate js/config.js
        env:
          SUBMIT_TOKEN: ${{ secrets.SUBMIT_TOKEN }}
        run: node .github/scripts/generate-config.js

      - name: Validate SUBMIT_TOKEN (repository_dispatch)
        env:
          SUBMIT_TOKEN: ${{ secrets.SUBMIT_TOKEN }}
        run: node .github/scripts/validate-submit-token.js

      - name: Verify js/config.js
        run: test -f js/config.js && grep -q "window.CONFIG" js/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
